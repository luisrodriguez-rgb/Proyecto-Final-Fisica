<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fafaf9; --panel:rgba(255,255,255,.86); --text:#18181b; --muted:#71717a; --border:#e4e4e7;
          --accent:#2563eb; --ok:#16a34a; --warn:#d97706; }
  :root.oscuro { --bg:#0b0b0d; --panel:rgba(20,20,23,.82); --text:#ececef; --muted:#8e8e98; --border:#2a2a30;
          --accent:#6ea8fe; --ok:#4ade80; --warn:#fbbf24; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
               font-family:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #wrap { position:relative; width:100%; height:100%; }
  canvas#c { display:block; width:100%; height:100%; outline:none; }
  .panel { position:absolute; background:var(--panel); border:1px solid var(--border); border-radius:8px;
           backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #hud { top:12px; left:12px; padding:10px 14px; min-width:250px; }
  #hud .t { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  #hud .row { display:flex; justify-content:space-between; gap:18px; font-size:13px; margin-top:5px; }
  #hud .row span:last-child { font-family:"JetBrains Mono", ui-monospace, Menlo, monospace; }
  #estado { margin-top:8px; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
  #estado i { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; }
  #estado.on i { background:var(--ok); box-shadow:0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
  #estado.rec i { background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  #bar { left:12px; bottom:12px; padding:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;
         max-width:calc(100% - 300px); }
  #bar button { font:inherit; font-size:12px; padding:5px 9px; border-radius:6px; border:1px solid var(--border);
                background:transparent; color:var(--text); cursor:pointer; }
  #bar button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #bar .sep { width:1px; height:22px; background:var(--border); margin:0 4px; }
  #bar label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #bar input[type=range] { width:80px; accent-color:var(--accent); }
  #chartbox { right:12px; bottom:12px; padding:8px 10px 6px; width:250px; }
  #chartbox .t { font-size:11px; color:var(--muted); }
  #chart { width:250px; height:110px; display:block; }
  #labels { position:absolute; inset:0; pointer-events:none; }
  .lab { position:absolute; transform:translate(-50%, -100%); white-space:nowrap; padding:5px 9px; font-size:12px;
         border-radius:6px; background:var(--panel); border:1px solid var(--border); line-height:1.35; }
  .lab b { font-weight:600; }
  .lab span { font-family:"JetBrains Mono", ui-monospace, Menlo, monospace; color:var(--warn); }
  .lab:after { content:""; position:absolute; left:50%; top:100%; width:1px; height:14px; background:var(--muted); }
  #hint { right:12px; top:12px; padding:6px 10px; font-size:11.5px; color:var(--muted); }
  @media (max-width: 760px) { #chartbox, #hint { display:none; } #bar { max-width:calc(100% - 24px); } }
  #sinwebgl { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" tabindex="0"></canvas>
  <div id="labels"></div>
  <div id="hud" class="panel">
    <div class="t">Detector de espira · <span id="hcarro"></span></div>
    <div class="row"><span>Posición del carro</span><span id="hx">–</span></div>
    <div class="row"><span>ΔL / L₀</span><span id="hdl">–</span></div>
    <div class="row"><span>Frecuencia del oscilador</span><span id="hf">–</span></div>
    <div class="row"><span>Potencia en el chasis</span><span id="hp">–</span></div>
    <div id="estado"><i></i><span id="htxt">Sin vehículo</span></div>
  </div>
  <div id="hint" class="panel">Arrastra para girar · rueda para acercar</div>
  <div id="bar" class="panel">
    <span id="carbtns"></span>
    <span class="sep"></span>
    <button id="play" class="on">Pausar</button>
    <button id="reset">Reiniciar</button>
    <label>Velocidad <input id="vel" type="range" min="3" max="30" value="12"><span id="velv">12 km/h</span></label>
    <span class="sep"></span>
    <button data-cam="general" class="cam on">General</button>
    <button data-cam="ras" class="cam">A ras</button>
    <button data-cam="arriba" class="cam">Arriba</button>
    <span class="sep"></span>
    <button id="tlab" class="on">Etiquetas</button>
    <button id="tcampo" class="on">Campo</button>
    <button id="tcorr" class="on">Corrientes</button>
  </div>
  <div id="chartbox" class="panel"><div class="t">−ΔL/L (%) frente a la posición del carro</div><canvas id="chart"></canvas></div>
  <div id="sinwebgl">Este navegador no tiene WebGL. Las gráficas de abajo muestran los mismos datos.</div>
</div>
<script>/*__THREE__*/</script>
<script>/*__ORBIT__*/</script>
<script>/*__ROOM__*/</script>
<script>
const D = /*__DATOS__*/;
(function () {
  const oscuro = D.tema === "Oscuro";
  if (oscuro) document.documentElement.classList.add("oscuro");
  const C = oscuro
    ? { bg: 0x0b0b0d, asfalto: 0x2a2c30, acera: 0x4a4b50, linea: 0xd8d8d0, campo: 0x6ea8fe, espira: 0xff9a3c,
        corr: 0xffb347, cielo: 0x1d2433, suelo: 0x0b0b0d, poste: 0x6b6f76, pantalla: "#0f1a14", txt: "#7dffb0" }
    : { bg: 0xf3f4f6, asfalto: 0x5b5e63, acera: 0xc9c9c4, linea: 0xf4f4ee, campo: 0x2563eb, espira: 0xf97316,
        corr: 0xf59e0b, cielo: 0xffffff, suelo: 0xb9b9b4, poste: 0x8a8f96, pantalla: "#0f1a14", txt: "#7dffb0" };

  const canvas = document.getElementById("c");
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
  catch (e) { document.getElementById("sinwebgl").style.display = "flex"; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  scene.background = new THREE.Color(C.bg);
  scene.fog = new THREE.Fog(C.bg, 22, 55);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.03, 200);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.minDistance = 1.2;
  controls.maxDistance = 30;

  scene.add(new THREE.HemisphereLight(C.cielo, C.suelo, oscuro ? 0.4 : 0.55));
  const sol = new THREE.DirectionalLight(0xffffff, oscuro ? 0.75 : 1.0);
  sol.position.set(-6, 11, 7);
  sol.castShadow = true;
  sol.shadow.mapSize.set(2048, 2048);
  Object.assign(sol.shadow.camera, { left: -12, right: 12, top: 8, bottom: -8, near: 1, far: 40 });
  scene.add(sol);

  // ---------------------------------------------------------------- pavimento
  function texturaAsfalto(base) {
    const cv = document.createElement("canvas"); cv.width = cv.height = 256;
    const g = cv.getContext("2d");
    const col = new THREE.Color(base);
    g.fillStyle = "#" + col.getHexString(); g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 5200; i++) {
      const v = (Math.random() - 0.5) * 34;
      g.fillStyle = `rgba(${128 + v},${128 + v},${128 + v},0.10)`;
      g.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
    }
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 10); t.encoding = THREE.sRGBEncoding;
    return t;
  }
  const suelo = new THREE.Mesh(new THREE.PlaneGeometry(70, 9),
    new THREE.MeshStandardMaterial({ color: 0xffffff, map: texturaAsfalto(C.asfalto), roughness: 0.96 }));
  suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; scene.add(suelo);
  for (const s of [-1, 1]) {
    const acera = new THREE.Mesh(new THREE.BoxGeometry(70, 0.15, 3),
      new THREE.MeshStandardMaterial({ color: C.acera, roughness: 0.9 }));
    acera.position.set(0, 0.075, s * 6); acera.receiveShadow = true; scene.add(acera);
  }
  const matLinea = new THREE.MeshStandardMaterial({ color: C.linea, roughness: 0.8 });
  for (let x = -30; x < 30; x += 3) {
    for (const z of [-1.9, 1.9]) {
      const l = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.004, 0.11), matLinea);
      l.position.set(x, 0.002, z); scene.add(l);
    }
  }
  const pare = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.004, 3.6), matLinea);
  pare.position.set(2.6, 0.002, 0); scene.add(pare);

  // ---------------------------------------------------------------- espira
  const E = D.espira, s2 = E.lado / 2;
  const matSello = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
  const matCable = new THREE.MeshStandardMaterial({ color: C.espira, emissive: C.espira, emissiveIntensity: 0.6 });
  const espira = new THREE.Group(); scene.add(espira);
  const lados = [[0, -s2, E.lado, 0], [0, s2, E.lado, 0], [-s2, 0, 0, E.lado], [s2, 0, 0, E.lado]];
  for (const [x, z, lx, lz] of lados) {
    const ranura = new THREE.Mesh(new THREE.BoxGeometry(lx || 0.06, 0.006, lz || 0.06), matSello);
    ranura.position.set(x, 0.003, z); espira.add(ranura);
    const cable = new THREE.Mesh(new THREE.BoxGeometry((lx || 0.02), 0.02, (lz || 0.02)), matCable);
    cable.position.set(x, 0.006, z); espira.add(cable);
  }
  const conexion = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.006, 3.0), matSello);
  conexion.position.set(s2, 0.003, -s2 - 1.5); scene.add(conexion);

  // ---------------------------------------------------------------- detector y talanquera
  const xT = 3.4, zT = -4.75;
  const matPoste = new THREE.MeshStandardMaterial({ color: C.poste, metalness: 0.5, roughness: 0.45 });
  const poste = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.2, 16), matPoste);
  poste.position.set(xT - 0.9, 0.75, zT); poste.castShadow = true; scene.add(poste);
  const caja = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.5, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x2b2f36, metalness: 0.3, roughness: 0.5 }));
  caja.position.set(xT - 0.9, 1.55, zT); caja.castShadow = true; scene.add(caja);
  const pcv = document.createElement("canvas"); pcv.width = 256; pcv.height = 300;
  const pctx = pcv.getContext("2d");
  const ptex = new THREE.CanvasTexture(pcv); ptex.encoding = THREE.sRGBEncoding;
  const pantalla = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.4), new THREE.MeshBasicMaterial({ map: ptex }));
  pantalla.position.set(xT - 0.9, 1.56, zT + 0.101); scene.add(pantalla);

  const baseT = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.0, 0.35),
    new THREE.MeshStandardMaterial({ color: 0xd9a400, roughness: 0.6 }));
  baseT.position.set(xT, 0.65, zT + 0.6); baseT.castShadow = true; scene.add(baseT);
  const brazo = new THREE.Group(); brazo.position.set(xT, 1.05, zT + 0.6); scene.add(brazo);
  const rcv = document.createElement("canvas"); rcv.width = 512; rcv.height = 16;
  const rctx = rcv.getContext("2d");
  for (let i = 0; i < 8; i++) { rctx.fillStyle = i % 2 ? "#ffffff" : "#d62828"; rctx.fillRect(i * 64, 0, 64, 16); }
  const rtex = new THREE.CanvasTexture(rcv); rtex.encoding = THREE.sRGBEncoding;
  const largoBrazo = 5.6;
  const barra = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, largoBrazo),
    new THREE.MeshStandardMaterial({ map: rtex, roughness: 0.5 }));
  barra.position.set(0, 0, largoBrazo / 2); barra.castShadow = true; brazo.add(barra);

  // ---------------------------------------------------------------- carros
  function crearCarro(c) {
    const L = c.largo, W = c.ancho, H = c.alto, h = c.altura_piso, wb = c.entre_ejes;
    const Hb = H - h, r = 0.29, R = r + 0.045;
    const xr = 0.43 * (L - wb), xf = xr + wb;
    const al = Math.asin(Math.min(0.99, (r - h) / R));
    const sh = new THREE.Shape();
    sh.moveTo(0.05 * L, h);
    sh.lineTo(xr - R * Math.cos(al), h);
    sh.absarc(xr, r, R, Math.PI + al, -al, true);
    sh.lineTo(xf - R * Math.cos(al), h);
    sh.absarc(xf, r, R, Math.PI + al, -al, true);
    sh.lineTo(0.965 * L, h);
    const P = [[1.0, 0.24], [0.995, 0.46], [0.955, 0.56], [0.72, 0.63], [0.53, 1.0], [0.13, 0.98], [0.035, 0.72],
               [0.0, 0.47], [0.008, 0.13]];
    for (const [fx, fy] of P) sh.lineTo(fx * L, h + fy * Hb);
    sh.lineTo(0.05 * L, h);
    const ext = { depth: W - 0.06, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 3, curveSegments: 20 };
    const geo = new THREE.ExtrudeGeometry(sh, ext);
    geo.translate(-L / 2, 0, -(W - 0.06) / 2);
    const g = new THREE.Group();
    const pintura = new THREE.MeshPhysicalMaterial({ color: c.color, metalness: 0.35, roughness: 0.38,
      clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 0.45 });
    const cuerpo = new THREE.Mesh(geo, pintura); cuerpo.castShadow = true; g.add(cuerpo);
    const vidrio = new THREE.MeshStandardMaterial({ color: 0x1a222c, metalness: 0.9, roughness: 0.12 });
    function placa(pts, depth) {
      const s = new THREE.Shape(); s.moveTo(pts[0][0] * L, h + pts[0][1] * Hb);
      for (const [fx, fy] of pts.slice(1)) s.lineTo(fx * L, h + fy * Hb);
      const gg = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false });
      gg.translate(-L / 2, 0, -depth / 2); return new THREE.Mesh(gg, vidrio);
    }
    g.add(placa([[0.155, 0.66], [0.165, 0.92], [0.505, 0.94], [0.685, 0.655]], W + 0.005));
    g.add(placa([[0.728, 0.64], [0.535, 1.012], [0.522, 1.012], [0.716, 0.64]], W - 0.18));
    g.add(placa([[0.04, 0.73], [0.128, 0.99], [0.118, 0.99], [0.03, 0.73]], W - 0.2));
    const llantaG = new THREE.CylinderGeometry(r, r, 0.18, 30), rinG = new THREE.CylinderGeometry(r * 0.6, r * 0.6, 0.19, 20);
    const matLl = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.85 });
    const matRin = new THREE.MeshStandardMaterial({ color: 0xb8bcc4, metalness: 0.85, roughness: 0.3 });
    const matRayo = new THREE.MeshStandardMaterial({ color: 0x5b6068, metalness: 0.8, roughness: 0.35 });
    const ruedas = [];
    for (const x of [xr, xf]) for (const s of [-1, 1]) {
      const rg = new THREE.Group();
      const ll = new THREE.Mesh(llantaG, matLl); ll.castShadow = true;
      const ri = new THREE.Mesh(rinG, matRin);
      for (let k = 0; k < 3; k++) {
        const rayo = new THREE.Mesh(new THREE.BoxGeometry(r * 1.18, 0.195, 0.04), matRayo);
        rayo.rotation.y = (k / 3) * Math.PI; ri.add(rayo);
      }
      rg.add(ll); rg.add(ri);
      rg.rotation.x = Math.PI / 2;
      const cont = new THREE.Group(); cont.position.set(x - L / 2, r, s * (W / 2 - 0.13)); cont.add(rg);
      g.add(cont); ruedas.push(rg);
    }
    const faro = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff4d6, emissiveIntensity: 0.8 });
    const stop = new THREE.MeshStandardMaterial({ color: 0xb91c1c, emissive: 0xb91c1c, emissiveIntensity: 0.6 });
    for (const s of [-1, 1]) {
      const f = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.09, 0.26), faro);
      f.position.set(L / 2 - 0.02, h + 0.5 * Hb, s * (W / 2 - 0.25)); g.add(f);
      const t = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.13, 0.16), stop);
      t.position.set(-L / 2 + 0.02, h + 0.62 * Hb, s * (W / 2 - 0.16)); g.add(t);
    }
    const piso = new THREE.Mesh(new THREE.BoxGeometry(L * 0.86, 0.01, W * 0.9),
      new THREE.MeshStandardMaterial({ color: 0x3a3c40, metalness: 0.6, roughness: 0.5 }));
    piso.position.set(0, h + 0.005, 0); g.add(piso);
    g.userData = { ruedas, r };
    return g;
  }
  const nombres = Object.keys(D.carros);
  const modelos = {}, lineas = {};
  for (const n of nombres) { modelos[n] = crearCarro(D.carros[n]); modelos[n].visible = false; scene.add(modelos[n]); }

  // ---------------------------------------------------------------- campo magnético
  const fcv = document.createElement("canvas"); fcv.width = 64; fcv.height = 4;
  const fctx = fcv.getContext("2d");
  const grad = fctx.createLinearGradient(0, 0, 64, 0);
  grad.addColorStop(0, "rgba(255,255,255,0.15)"); grad.addColorStop(0.7, "rgba(255,255,255,1)");
  grad.addColorStop(1, "rgba(255,255,255,0.15)");
  fctx.fillStyle = grad; fctx.fillRect(0, 0, 64, 4);
  function grupoLineas(datos, color) {
    const g = new THREE.Group();
    const tex = new THREE.CanvasTexture(fcv); tex.wrapS = THREE.RepeatWrapping;
    const mat = new THREE.MeshBasicMaterial({ color, map: tex, transparent: true, opacity: 0.85, depthWrite: false,
      blending: THREE.NormalBlending });
    for (const perfil of datos.perfiles) for (const ang of datos.angulos) {
      const pts = perfil.map(([r, y]) => new THREE.Vector3(r * Math.cos(ang), y, r * Math.sin(ang)));
      if (pts.length < 3) continue;
      const curva = new THREE.CatmullRomCurve3(pts);
      const largo = curva.getLength();
      const geo = new THREE.TubeGeometry(curva, Math.max(16, Math.round(largo * 30)), 0.006, 5, false);
      const m = mat.clone(); m.map = tex.clone(); m.map.repeat.set(Math.max(1, largo / 0.18), 1); m.map.needsUpdate = true;
      g.add(new THREE.Mesh(geo, m));
    }
    g.userData.mats = g.children.map(ch => ch.material); scene.add(g); return g;
  }
  const campoVacio = grupoLineas(D.lineas_vacio, C.campo);
  for (const n of nombres) { lineas[n] = grupoLineas(D.carros[n].lineas, C.campo); lineas[n].visible = false; }

  // corrientes de Foucault en la cara inferior del chasis (anillos sobre la espira)
  const corr = new THREE.Group(); scene.add(corr);
  const matCorr = new THREE.MeshBasicMaterial({ color: C.corr, transparent: true, opacity: 0, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false });
  for (const rr of [0.22, 0.38, 0.54, 0.7]) {
    const anillo = new THREE.Mesh(new THREE.RingGeometry(rr, rr + 0.025, 64), matCorr);
    anillo.rotation.x = Math.PI / 2; corr.add(anillo);
  }

  // ---------------------------------------------------------------- etiquetas HTML
  const capa = document.getElementById("labels");
  function etiqueta() { const d = document.createElement("div"); d.className = "lab"; capa.appendChild(d); return d; }
  const L_esp = etiqueta(), L_ch = etiqueta(), L_det = etiqueta(), L_tal = etiqueta(), L_car = etiqueta();
  const v3 = new THREE.Vector3();
  function ubicar(div, x, y, z, dy) {
    v3.set(x, y, z).project(camera);
    const vis = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1;
    div.style.display = vis && mostrar.lab ? "block" : "none";
    div.style.left = ((v3.x + 1) / 2 * canvas.clientWidth) + "px";
    div.style.top = ((1 - v3.y) / 2 * canvas.clientHeight - (dy || 16)) + "px";
  }

  // ---------------------------------------------------------------- estado y controles
  const mostrar = { lab: true, campo: true, corr: true };
  let actual = D.carro_inicial in D.carros ? D.carro_inicial : nombres[0];
  let jugando = true, vel = 12 / 3.6, x = -8.5, fase = "llega", espera = 0, angBrazo = 0;
  const btns = document.getElementById("carbtns");
  for (const n of nombres) {
    const b = document.createElement("button"); b.textContent = D.carros[n].corto; b.dataset.n = n;
    b.onclick = () => { actual = n; reiniciar(); marcar(); }; btns.appendChild(b);
  }
  function marcar() { for (const b of btns.children) b.classList.toggle("on", b.dataset.n === actual); }
  function reiniciar() { x = -8.5; fase = "llega"; espera = 0; }
  document.getElementById("play").onclick = (e) => { jugando = !jugando; e.target.textContent = jugando ? "Pausar" : "Reproducir"; };
  document.getElementById("reset").onclick = reiniciar;
  const velIn = document.getElementById("vel"), velV = document.getElementById("velv");
  velIn.oninput = () => { vel = velIn.value / 3.6; velV.textContent = velIn.value + " km/h"; };
  for (const [id, k] of [["tlab", "lab"], ["tcampo", "campo"], ["tcorr", "corr"]]) {
    document.getElementById(id).onclick = (e) => { mostrar[k] = !mostrar[k]; e.target.classList.toggle("on", mostrar[k]); };
  }
  const CAMS = {
    general: { p: [-7.2, 4.4, 7.4], t: [0.6, 0.5, -0.6], polar: 0.495 },
    ras: { p: [3.6, 0.22, 4.6], t: [-0.3, 0.12, 0], polar: 0.5 },
    arriba: { p: [0.4, 13, 0.01], t: [0.4, 0, -0.6], polar: 0.495 },
  };
  let camObj = null;
  for (const b of document.querySelectorAll(".cam")) b.onclick = () => {
    camObj = CAMS[b.dataset.cam]; controls.maxPolarAngle = Math.PI * camObj.polar;
    for (const o of document.querySelectorAll(".cam")) o.classList.toggle("on", o === b);
  };
  camera.position.set(...CAMS.general.p); controls.target.set(...CAMS.general.t);
  marcar();

  // ---------------------------------------------------------------- interpolación de los datos de Python
  function interp(c, campo, xx) {
    const xs = c.x, n = xs.length, x0 = xs[0], dx = xs[1] - xs[0];
    const k = (xx - x0) / dx; if (k <= 0) return c[campo][0]; if (k >= n - 1) return c[campo][n - 1];
    const i = Math.floor(k), f = k - i; return c[campo][i] * (1 - f) + c[campo][i + 1] * f;
  }

  // ---------------------------------------------------------------- mini gráfica
  const ch = document.getElementById("chart"), cx = ch.getContext("2d");
  function dibujarGrafica(c) {
    const dpr = Math.min(window.devicePixelRatio, 2), W = 250, H = 110;
    if (ch.width !== W * dpr) { ch.width = W * dpr; ch.height = H * dpr; }
    cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
    const st = getComputedStyle(document.documentElement);
    const xmin = -6, xmax = 6, ymax = Math.max(...nombres.map(n => -D.carros[n].dL_max * 100)) * 1.15;
    const X = v => 8 + (v - xmin) / (xmax - xmin) * (W - 16), Y = v => H - 14 - v / ymax * (H - 26);
    cx.strokeStyle = st.getPropertyValue("--border"); cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(8, Y(0)); cx.lineTo(W - 8, Y(0)); cx.stroke();
    cx.setLineDash([4, 3]); cx.strokeStyle = st.getPropertyValue("--muted");
    cx.beginPath(); cx.moveTo(8, Y(D.umbral_pct)); cx.lineTo(W - 8, Y(D.umbral_pct)); cx.stroke(); cx.setLineDash([]);
    for (const n of nombres) {
      const cc = D.carros[n]; cx.strokeStyle = cc.color; cx.lineWidth = n === actual ? 2.2 : 1; cx.globalAlpha = n === actual ? 1 : 0.45;
      cx.beginPath(); let first = true;
      for (let i = 0; i < cc.x.length; i++) { const xv = cc.x[i]; if (xv < xmin || xv > xmax) continue;
        const px = X(xv), py = Y(-cc.dL_rel[i] * 100); if (first) { cx.moveTo(px, py); first = false; } else cx.lineTo(px, py); }
      cx.stroke(); cx.globalAlpha = 1;
    }
    const yv = -interp(c, "dL_rel", x) * 100;
    cx.fillStyle = st.getPropertyValue("--text"); cx.beginPath(); cx.arc(X(Math.max(xmin, Math.min(xmax, x))), Y(yv), 3.5, 0, 7); cx.fill();
    cx.fillStyle = st.getPropertyValue("--muted"); cx.font = "10px Inter, sans-serif";
    cx.fillText("umbral " + D.umbral_pct.toFixed(1) + " %", W - 80, Y(D.umbral_pct) - 4);
    cx.fillText("x (m)", W - 34, H - 2);
  }

  // ---------------------------------------------------------------- pantalla del detector
  function dibujarPantalla(f, df, txt, on) {
    pctx.fillStyle = C.pantalla; pctx.fillRect(0, 0, 256, 300);
    pctx.fillStyle = "#3a4a40"; pctx.fillRect(10, 10, 236, 280);
    pctx.fillStyle = C.pantalla; pctx.fillRect(16, 16, 224, 268);
    pctx.fillStyle = C.txt; pctx.font = "bold 26px monospace"; pctx.fillText("DETECTOR", 30, 54);
    pctx.font = "22px monospace"; pctx.fillText("f  " + f.toFixed(2) + " kHz", 30, 104);
    pctx.fillText("Δf " + (df >= 0 ? "+" : "") + df.toFixed(2) + " kHz", 30, 140);
    pctx.fillStyle = on ? "#7dffb0" : "#4a6a58"; pctx.font = "bold 30px monospace"; pctx.fillText(txt, 30, 214);
    pctx.beginPath(); pctx.arc(206, 50, 12, 0, 7); pctx.fillStyle = on ? "#22e07a" : "#29402f"; pctx.fill();
    ptex.needsUpdate = true;
  }

  // ---------------------------------------------------------------- bucle
  const hx = document.getElementById("hx"), hdl = document.getElementById("hdl"), hf = document.getElementById("hf"),
        hp = document.getElementById("hp"), htxt = document.getElementById("htxt"), est = document.getElementById("estado"),
        hcar = document.getElementById("hcarro");
  const reloj = new THREE.Clock(); let tPant = 0;
  function tamano() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", tamano); tamano();

  function avanzar(dt) {
    const a = 1.6;
    if (fase === "llega") {
      const dFreno = vel * vel / (2 * a);
      const v = x < -dFreno ? vel : Math.sqrt(Math.max(0.04, 2 * a * Math.max(0, -x)));
      x += v * dt; if (x >= 0) { x = 0; fase = "espera"; espera = 0; } return v;
    }
    if (fase === "espera") { espera += dt; if (espera > 2.2) fase = "sale"; return 0; }
    if (fase === "sale") { x += Math.min(vel, 0.3 + espera) * dt; espera += dt * 1.2; if (x > 9) { fase = "fin"; espera = 0; } return Math.min(vel, 0.3 + espera); }
    espera += dt; if (espera > 1.2) reiniciar(); return 0;
  }

  function cuadro() {
    requestAnimationFrame(cuadro);
    const dt = Math.min(reloj.getDelta(), 0.05), t = reloj.elapsedTime;
    const c = D.carros[actual];
    let v = 0; if (jugando) v = avanzar(dt);
    for (const n of nombres) { modelos[n].visible = n === actual; lineas[n].visible = false; }
    const m = modelos[actual]; m.position.x = x;
    for (const rg of m.userData.ruedas) rg.rotation.y -= v * dt / m.userData.r;

    const dl = interp(c, "dL_rel", x), cob = Math.abs(dl / c.dL_max);
    const fr = E.f0_kHz * (1 - 0.5 * dl), dfr = fr - E.f0_kHz, pot = interp(c, "potencia_uW", x);
    const detect = -dl * 100 >= D.umbral_pct;
    const reconocido = detect && cob > 0.97;
    // campo: mezcla entre el campo libre y el campo con el carro encima
    const lc = lineas[actual];
    campoVacio.visible = lc.visible = mostrar.campo;
    for (const mm of campoVacio.userData.mats) { mm.opacity = 0.8 * (1 - cob); mm.map.offset.x -= dt * 0.9; }
    for (const mm of lc.userData.mats) { mm.opacity = 0.9 * cob; mm.map.offset.x -= dt * 0.9; }
    matCable.emissiveIntensity = 0.45 + 0.35 * Math.abs(Math.sin(t * 6));
    corr.visible = mostrar.corr;
    corr.position.set(0, c.altura_piso - 0.004, 0);
    matCorr.opacity = cob * (0.55 + 0.35 * Math.abs(Math.sin(t * 6)));
    corr.rotation.y += dt * 1.5;
    // talanquera
    const abierta = detect || (x > 0 && x < 7.5);
    angBrazo += ((abierta ? 1.45 : 0) - angBrazo) * Math.min(1, dt * 3);
    brazo.rotation.x = -angBrazo;
    // cámara
    if (camObj) {
      camera.position.lerp(new THREE.Vector3(...camObj.p), 0.08);
      controls.target.lerp(new THREE.Vector3(...camObj.t), 0.08);
      if (camera.position.distanceTo(new THREE.Vector3(...camObj.p)) < 0.02) camObj = null;
    }
    controls.update();
    renderer.render(scene, camera);

    // lecturas
    hcar.textContent = actual;
    hx.textContent = (x >= 0 ? "+" : "") + x.toFixed(2) + " m";
    hdl.textContent = (dl * 100).toFixed(2) + " %";
    hf.textContent = fr.toFixed(2) + " kHz";
    hp.textContent = pot.toFixed(1) + " µW";
    est.className = reconocido ? "rec" : (detect ? "on" : "");
    htxt.textContent = reconocido ? `Reconocido: ${D.carros[c.reconocido].corto} (altura estimada ${(c.altura_estimada * 100).toFixed(1)} cm)`
      : (detect ? "Vehículo detectado · talanquera abierta" : "Sin vehículo");
    L_esp.innerHTML = `<b>Espira</b> · ${E.vueltas} vueltas · ${E.L0_uH.toFixed(1)} µH<br><span>${(E.corriente_A * 1000).toFixed(0)} mA a ${E.f0_kHz.toFixed(1)} kHz</span>`;
    L_ch.innerHTML = `<b>Chasis de acero</b> · δ = ${E.delta_acero_mm.toFixed(3)} mm<br><span>absorbe ${pot.toFixed(1)} µW</span>`;
    L_det.innerHTML = `<b>Detector</b><br><span>f = ${fr.toFixed(2)} kHz</span>`;
    L_tal.innerHTML = `<b>Talanquera</b><br><span>${abierta ? "abierta" : "cerrada"}</span>`;
    L_car.innerHTML = `<b>${actual}</b><br>altura al piso ${(c.altura_piso * 100).toFixed(0)} cm · ${c.peso} kg`;
    ubicar(L_esp, -s2, 0, s2, 14);
    ubicar(L_ch, x + c.largo * 0.32, c.altura_piso, c.ancho / 2, 22);
    if (cob < 0.05) L_ch.style.display = "none";
    ubicar(L_det, xT - 0.9, 1.85, zT, 10);
    ubicar(L_tal, xT, 1.25, zT + 0.6, 10);
    ubicar(L_car, x, c.alto + 0.15, 0, 8);
    if (t - tPant > 0.1) {
      tPant = t; dibujarGrafica(c);
      dibujarPantalla(fr, dfr, reconocido ? D.carros[c.reconocido].corto.toUpperCase() : (detect ? "VEHÍCULO" : "LIBRE"), detect);
    }
  }
  cuadro();
})();
</script>
</body>
</html>
