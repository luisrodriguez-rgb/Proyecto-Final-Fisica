<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fafaf9; --panel:rgba(255,255,255,.86); --text:#18181b; --muted:#71717a; --border:#e4e4e7;
          --accent:#2563eb; --ok:#16a34a; --warn:#d97706; }
  :root.oscuro { --bg:#0b0b0d; --panel:rgba(20,20,23,.82); --text:#ececef; --muted:#8e8e98; --border:#2a2a30;
          --accent:#6ea8fe; --ok:#4ade80; --warn:#fbbf24; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
               font-family:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #wrap { position:relative; width:100%; height:100%; }
  canvas#c { display:block; width:100%; height:100%; outline:none; }
  .panel { position:absolute; background:var(--panel); border:1px solid var(--border); border-radius:8px;
           backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #hud { top:12px; left:12px; padding:10px 14px; min-width:250px; }
  #hud .t { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  #hud .row { display:flex; justify-content:space-between; gap:18px; font-size:13px; margin-top:5px; }
  #hud .row span:last-child { font-family:"JetBrains Mono", ui-monospace, Menlo, monospace; }
  #estado { margin-top:8px; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
  #estado i { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; }
  #estado.on i { background:var(--ok); box-shadow:0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
  #estado.rec i { background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  #bar { left:12px; bottom:12px; padding:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;
         max-width:calc(100% - 300px); }
  #bar button { font:inherit; font-size:12px; padding:5px 9px; border-radius:6px; border:1px solid var(--border);
                background:transparent; color:var(--text); cursor:pointer; }
  #bar button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #bar .sep { width:1px; height:22px; background:var(--border); margin:0 4px; }
  #bar label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #bar input[type=range] { width:80px; accent-color:var(--accent); }
  #chartbox { right:12px; bottom:12px; padding:8px 10px 6px; width:250px; }
  #chartbox .t { font-size:11px; color:var(--muted); }
  #chart { width:250px; height:110px; display:block; }
  #labels { position:absolute; inset:0; pointer-events:none; }
  .lab { position:absolute; transform:translate(-50%, -100%); white-space:nowrap; padding:5px 9px; font-size:12px;
         border-radius:6px; background:var(--panel); border:1px solid var(--border); line-height:1.35; }
  .lab b { font-weight:600; }
  .lab span { font-family:"JetBrains Mono", ui-monospace, Menlo, monospace; color:var(--warn); }
  .lab:after { content:""; position:absolute; left:50%; top:100%; width:1px; height:14px; background:var(--muted); }
  #hint { right:12px; top:12px; padding:6px 10px; font-size:11.5px; color:var(--muted); }
  @media (max-width: 760px) { #chartbox, #hint { display:none; } #bar { max-width:calc(100% - 24px); } }
  #sinwebgl { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" tabindex="0"></canvas>
  <div id="labels"></div>
  <div id="hud" class="panel">
    <div class="t">Detector de espira · <span id="hcarro"></span></div>
    <div class="row"><span>Posición del carro</span><span id="hx">–</span></div>
    <div class="row"><span>ΔL / L₀</span><span id="hdl">–</span></div>
    <div class="row"><span>Frecuencia del oscilador</span><span id="hf">–</span></div>
    <div class="row"><span>Potencia en el chasis</span><span id="hp">–</span></div>
    <div id="estado"><i></i><span id="htxt">Sin vehículo</span></div>
  </div>
  <div id="hint" class="panel">Arrastra para girar · rueda para acercar</div>
  <div id="bar" class="panel">
    <span id="carbtns"></span>
    <span class="sep"></span>
    <button id="play" class="on">Pausar</button>
    <button id="reset">Reiniciar</button>
    <label>Velocidad <input id="vel" type="range" min="3" max="30" value="12"><span id="velv">12 km/h</span></label>
    <span class="sep"></span>
    <button data-cam="general" class="cam on">General</button>
    <button data-cam="ras" class="cam">A ras</button>
    <button data-cam="arriba" class="cam">Arriba</button>
    <span class="sep"></span>
    <button id="tlab" class="on">Etiquetas</button>
    <button id="tcampo" class="on">Campo</button>
    <button id="tcorr" class="on">Corrientes</button>
  </div>
  <div id="chartbox" class="panel"><div class="t">−ΔL/L (%) frente a la posición del carro</div><canvas id="chart"></canvas></div>
  <div id="sinwebgl">Este navegador no tiene WebGL. Las gráficas de abajo muestran los mismos datos.</div>
</div>
<script>/*__THREE__*/</script>
<script>/*__ORBIT__*/</script>
<script>window.__D = /*__DATOS__*/;</script>
<script>/*__JS__*/</script>
</body>
</html>
